name: Deploy and Run Script

on:
  workflow_dispatch:
    inputs:
      customMessage:
        description: "Ejecucion manual del flujo"
        required: false
        default: "Ejecucion manual del flujo"
      url:
        description: "URL de la publicacion del puesto de trabajo a analizar"
        required: true


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --no-dev

    - name: Run script
      env:
        CUENTA: ${{ secrets.CUENTA_CORREO }}
        PASSWORD: ${{ secrets.PASSWORD_CUENTA }}
        RECIPIENTS: ${{ secrets.RECIPIENTS }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        URL: ${{ github.event.inputs.url }}

      run: uv run src/main.py