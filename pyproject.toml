[project]
name = "cv-analyzer"
version = "0.1.0"
description = "Reporistorio de un agente para la busqueda de puestos de trabajo mas afines al perfil y preferencias"
authors = [
    {name = "SpiderCoop",email = "david.jimenez.cooper@gmail.com"}
]
license = "Apache 2.0"
requires-python = "^3.12"
dependencies = [
    "email-automation-sc (>=1.0.1,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "langchain (>=1.3.11,<2.0.0)",
    "langchain-core (>=1.4.8,<2.0.0)",
    "poetry (>=2.4.1,<3.0.0)",
    "langchain-google-genai (>=4.2.6,<5.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "tqdm (>=4.68.3,<5.0.0)",
    "pymupdf (>=1.28.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
